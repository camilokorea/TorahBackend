
name: Deploy TorahBackend to Linode

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release

    - name: Publish
      run: dotnet publish TorahBackend/TorahBackend.WebApi.csproj --configuration Release --output ./publish

    - name: Copy files to Linode via rsync
      uses: appleboy/rsync-deploy@v1
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        source: "publish/"
        target: "${{ secrets.DEPLOY_PATH }}"

    - name: Deploy to Linode
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          pm2 restart bibliaapi.comunidadmenorah.com
