
name: Deploy TorahBackend to Linode

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '6.0.x'

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release

    - name: Create appsettings.json from template
      run: |
        sed -e "s|__JWT_SECRET__|${{ secrets.JWT_SECRET }}|g" \
            -e "s|__DB_CONNECTION__|${{ secrets.DB_CONNECTION }}|g" \
            TorahBackend/TorahBackend/appsettings.template.json > TorahBackend/TorahBackend/appsettings.json

    - name: Publish
      run: dotnet publish TorahBackend/TorahBackend.WebApi.csproj --configuration Release --output ./publish

    - name: Install SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.LINODE_SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa

    - name: Add host to known_hosts
      run: ssh-keyscan -p 22 -H "${{ secrets.LINODE_HOST }}" >> ~/.ssh/known_hosts

    - name: Copy files via scp
      run: scp -r -i ~/.ssh/id_rsa ./publish/* ${{ secrets.LINODE_USERNAME }}@${{ secrets.LINODE_HOST }}:${{ secrets.DEPLOY_PATH }}

    - name: Deploy to Linode
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.LINODE_HOST }}
        username: ${{ secrets.LINODE_USERNAME }}
        key: ${{ secrets.LINODE_SSH_KEY }}
        port: 22
        script: |
          cd ${{ secrets.DEPLOY_PATH }}
          pm2 restart bibliaapi.comunidadmenorah.com
